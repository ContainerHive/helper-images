# Auto-generated by ContainerHive
# Do not edit - regenerate with: ch template ci --provider github --output .github/workflows/build.yml --image-name ghcr.io/containerhive/containerhive
# tag_ranges resolved to 24 shard unit(s) - regenerate if this changes.

name: Build Images

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'push' && format('{0}-{1}', github.workflow, github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  packages: write
  contents: read
  actions: read
  checks: write
  pull-requests: write
  pages: write
  id-token: write

env:
  SNAPSHOT_ID: "${{ github.event.pull_request.number }}"
  CH_IMAGE: ghcr.io/containerhive/containerhive:ea01911

jobs:
  # === GENERATE ===
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          lfs: true
      - name: Prepare temp directory
        run: mkdir -p "$RUNNER_TEMP/ch"
      - name: Restore version cache
        uses: actions/cache@v4.2.0
        with:
          path: .ch-cache
          key: ch-versions-${{ github.run_id }}
          restore-keys: |
            ch-versions-
      - name: Login to registry
        run: echo "${{ secrets.CONTAINER_HIVE_REGISTRY_PASSWORD }}" | docker run --rm --entrypoint="" -u "$(id -u):$(id -g)" -e CI=1 -i -e HOME="$RUNNER_TEMP/ch" -v "$RUNNER_TEMP/ch:$RUNNER_TEMP/ch" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" $CH_IMAGE ch login -u "${{ secrets.CONTAINER_HIVE_REGISTRY_USERNAME }}" --password-stdin "ghcr.io"
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker run --rm --entrypoint="" -u "$(id -u):$(id -g)" -e CI=1 -i -e HOME="$RUNNER_TEMP/ch" -v "$RUNNER_TEMP/ch:$RUNNER_TEMP/ch" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" $CH_IMAGE ch login -u "${{ github.actor }}" --password-stdin ghcr.io
      - name: Generate build files
        run: docker run --rm --entrypoint="" -u "$(id -u):$(id -g)" -e CI=1 -e HOME="$RUNNER_TEMP/ch" -e CONTAINER_HIVE_CACHE_DIR="$GITHUB_WORKSPACE/.ch-cache" -v "$RUNNER_TEMP/ch:$RUNNER_TEMP/ch" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" $CH_IMAGE ch generate --build-id "$SNAPSHOT_ID"
      - name: Upload generated files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: generated
          path: dist/
          retention-days: 7

  lint:
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          lfs: true
      - name: Restore version cache
        uses: actions/cache/restore@v4.2.0
        with:
          path: .ch-cache
          key: ch-versions-${{ github.run_id }}
          restore-keys: |
            ch-versions-
      - name: Lint Dockerfiles
        run: docker run --rm --entrypoint="" -u "$(id -u):$(id -g)" -e CI=1 -e HOME="$RUNNER_TEMP/ch" -e CONTAINER_HIVE_CACHE_DIR="$GITHUB_WORKSPACE/.ch-cache" -v "$RUNNER_TEMP/ch:$RUNNER_TEMP/ch" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" $CH_IMAGE ch lint --format github-actions

  # === CHISEL ===

  build-chisel-amd64:
    runs-on: ubuntu-24.04
    needs:
      - generate
      - lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          lfs: true
      - name: Download generated files
        uses: actions/download-artifact@v8.0.2
        with:
          name: generated
          path: dist/
      - name: Prepare temp directory
        run: mkdir -p "$RUNNER_TEMP/ch"
      - name: Restore version cache
        uses: actions/cache/restore@v4.2.0
        with:
          path: .ch-cache
          key: ch-versions-${{ github.run_id }}
          restore-keys: |
            ch-versions-
      - name: Create Docker network
        run: docker network create ch-net
      - name: Start BuildKit daemon
        run: docker run -d --name buildkitd --privileged --network ch-net moby/buildkit:v0.34.0 --addr tcp://0.0.0.0:8372
      - name: Login to registry
        run: echo "${{ secrets.CONTAINER_HIVE_REGISTRY_PASSWORD }}" | docker run --rm --entrypoint="" -u "$(id -u):$(id -g)" -e CI=1 -i -e HOME="$RUNNER_TEMP/ch" -v "$RUNNER_TEMP/ch:$RUNNER_TEMP/ch" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" --network ch-net -e BUILDKIT_HOST=tcp://buildkitd:8372 $CH_IMAGE ch login -u "${{ secrets.CONTAINER_HIVE_REGISTRY_USERNAME }}" --password-stdin "ghcr.io"
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker run --rm --entrypoint="" -u "$(id -u):$(id -g)" -e CI=1 -i -e HOME="$RUNNER_TEMP/ch" -v "$RUNNER_TEMP/ch:$RUNNER_TEMP/ch" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" --network ch-net -e BUILDKIT_HOST=tcp://buildkitd:8372 $CH_IMAGE ch login -u "${{ github.actor }}" --password-stdin ghcr.io
      - name: Wait for BuildKit
        run: docker run --rm --entrypoint="" -u "$(id -u):$(id -g)" -e CI=1 -e HOME="$RUNNER_TEMP/ch" -v "$RUNNER_TEMP/ch:$RUNNER_TEMP/ch" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" --network ch-net -e BUILDKIT_HOST=tcp://buildkitd:8372 $CH_IMAGE ch wait --buildkitd
      - name: Build image
        run: docker run --rm --entrypoint="" -u "$(id -u):$(id -g)" -e CI=1 -e HOME="$RUNNER_TEMP/ch" -e CONTAINER_HIVE_CACHE_DIR="$GITHUB_WORKSPACE/.ch-cache" -v "$RUNNER_TEMP/ch:$RUNNER_TEMP/ch" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" --network ch-net -e BUILDKIT_HOST=tcp://buildkitd:8372 $CH_IMAGE ch build chisel --platform amd64 --build-id "$SNAPSHOT_ID"
      - name: Generate SBOM
        run: docker run --rm --entrypoint="" -u "$(id -u):$(id -g)" -e CI=1 -e HOME="$RUNNER_TEMP/ch" -e CONTAINER_HIVE_CACHE_DIR="$GITHUB_WORKSPACE/.ch-cache" -v "$RUNNER_TEMP/ch:$RUNNER_TEMP/ch" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" --network ch-net -e BUILDKIT_HOST=tcp://buildkitd:8372 $CH_IMAGE ch sbom chisel --platform amd64 --build-id "$SNAPSHOT_ID"
      - name: Upload SBOM
        uses: actions/upload-artifact@v7.0.2
        with:
          name: chisel-amd64-sbom
          path: dist/*/*/*/cyclonedx.json
          retention-days: 30

