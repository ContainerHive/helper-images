      - name: Generate SBOM
        run: docker run --rm --entrypoint="" -u "$(id -u):$(id -g)" -e CI=1 -e HOME="$RUNNER_TEMP/ch" -e CONTAINER_HIVE_CACHE_DIR="$GITHUB_WORKSPACE/.ch-cache" -v "$RUNNER_TEMP/ch:$RUNNER_TEMP/ch" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" --network ch-net -e BUILDKIT_HOST=tcp://buildkitd:8372 $CH_IMAGE ch sbom nix --platform arm64 --build-id "$SNAPSHOT_ID"
      - name: Upload SBOM
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nix-arm64-sbom
          path: dist/*/*/*/cyclonedx.json
          retention-days: 30


