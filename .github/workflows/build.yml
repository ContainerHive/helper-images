  test-nix-amd64:
    runs-on: ubuntu-24.04
    needs:
      - build-nix-amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          lfs: true
      - name: Download generated files
        uses: actions/download-artifact@v8.0.2
        with:
          name: generated
          path: dist/
      - name: Prepare temp directory
        run: mkdir -p "$RUNNER_TEMP/ch"
