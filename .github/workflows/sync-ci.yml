name: Sync CI

# The build workflow is generated from the images, and `tag_ranges` change what it contains whenever Chisel or Nix
# publish a new release series. This workflow regenerates it and opens a PR when it drifted.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  BUILD_WORKFLOW: .github/workflows/build.yml

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # create-pull-request adds its own Authorization header; the credentials that
          # checkout persists by default would arrive as a duplicate header (HTTP 400).
          persist-credentials: false
      - name: Restore version cache
        uses: actions/cache@v4.2.0
        with:
          path: .ch-cache
          key: ch-versions-sync-${{ github.run_id }}
          restore-keys: |
            ch-versions-
      - name: Regenerate build workflow
        run: |
          set -euo pipefail
          ch_image=$(sed -n 's/^  CH_IMAGE: //p' "$BUILD_WORKFLOW")
          docker run --rm --entrypoint="" -u "$(id -u):$(id -g)" -e CI=1 \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e CONTAINER_HIVE_CACHE_DIR="$GITHUB_WORKSPACE/.ch-cache" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" "$ch_image" \
            ch template ci --provider github --output "$BUILD_WORKFLOW" \
              --image-name "${ch_image%:*}" --version "${ch_image##*:}"
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7.0.8
        with:
          # Pushing workflow files needs a token with the `workflow` scope. Falls back to
          # GITHUB_TOKEN, which GitHub rejects for workflow-file changes ("refusing to allow
          # a GitHub Actions token to create or update workflow without `workflow` scope"),
          # so the run fails loudly instead of silently skipping the sync.
          token: ${{ secrets.CI_SYNC_TOKEN || github.token }}
          branch: ci/sync-build-workflow
          commit-message: "ci: regenerate build workflow for current tag ranges"
          title: "ci: regenerate build workflow for current tag ranges"
          body: |
            Chisel or Nix published a new release series, so the generated build workflow changed.

            Regenerated by the `Sync CI` workflow with `ch template ci`.
          delete-branch: true
          add-paths: .github/workflows/build.yml
